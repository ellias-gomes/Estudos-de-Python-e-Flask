<!DOCTYPE html>
<html>
<head>
    <title>Lista de Usuários</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Total de Usuários: {{ usuarios|length }}</h1>
    
    <ul>
        {% for usuario in usuarios %}
            <li>{{ usuario.nome }} - {{ usuario.email }}</li>
        {% endfor %}
    </ul>
</body>
</html>
