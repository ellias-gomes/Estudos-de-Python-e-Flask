<!DOCTYPE html>
<html>
<head>
    <title>Cadastro</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="register-container">
        <h2>Crie sua conta</h2>
        
        <!-- Mensagens de erro/sucesso -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('cadastro') }}">
            <div class="form-group">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha (mínimo 8 caracteres):</label>
                <input type="password" id="senha" name="senha" minlength="8" required pattern="^(?=.*[A-Z]).{8,}$" title="Mínimo 8 caracteres, incluindo 1 letra maiúscula">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" pattern="[0-9]{11}" title="11 dígitos (incluindo DDD)" required>
            </div>

            <button type="submit">Registrar</button>
        </form>

        <p class="login-link">Já tem conta? <a href="{{ url_for('login') }}">Faça login</a></p>
    </div>
</body>
</html>
